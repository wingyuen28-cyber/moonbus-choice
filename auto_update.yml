name: Auto Update HKJC Data

on:
  schedule:
    # 設定定時任務：每週三、六、日香港時間中午 12 點自動執行 (UTC 04:00)
    - cron: '0 4 * * 3,6,0'
  workflow_dispatch: # 支援在 GitHub 網頁手動按下「Run workflow」按鈕立即執行

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v3

      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝所需套件
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: 執行馬會資料爬蟲
        run: python scraper.py

      - name: 自動 Commit 並 Push 到 GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git status
          git diff-index --quiet HEAD || git commit -m "Auto: 更新最新馬會排位與賽事資料"
          git push
