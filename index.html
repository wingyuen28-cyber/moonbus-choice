<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moonbus Choice 馬會官方同款排位表</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --sub-text: #94a3b8;
            --hkjc-blue: #003366;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 10px;
        }

        .header-box {
            background: var(--card);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #334155;
            margin-bottom: 10px;
        }

        .header-box h1 { margin: 0 0 6px 0; font-size: 1.1rem; color: var(--accent); }
        .meta-tags { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; font-size: 0.8rem; }
        .tag { background: #334155; padding: 2px 6px; border-radius: 4px; }
        .tag-highlight { background: #0284c7; font-weight: bold; }

        /* 場次按鈕 */
        .race-nav {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 6px;
            margin-bottom: 10px;
        }

        .race-btn {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            white-space: nowrap;
            cursor: pointer;
        }

        .race-btn.active {
            background: var(--accent);
            color: #0f172a;
            border-color: var(--accent);
        }

        /* 賽事資訊欄 */
        .race-info-bar {
            background: #1e293b;
            border-left: 4px solid var(--accent);
            padding: 8px 12px;
            margin-bottom: 10px;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
        }

        /* 官方排位表格對齊 */
        .table-container {
            overflow-x: auto;
            background: var(--card);
            border-radius: 6px;
            border: 1px solid #334155;
        }

        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; text-align: center; }
        th { background: #0f172a; color: var(--accent); padding: 8px 4px; border-bottom: 1px solid #334155; white-space: nowrap; }
        td { padding: 8px 4px; border-bottom: 1px solid #1e293b; white-space: nowrap; }
        tr:nth-child(even) { background: rgba(255,255,255,0.02); }

        .horse-name { text-align: left; font-weight: bold; color: #fff; font-size: 0.85rem; }
        .draw-badge { background: #334155; padding: 1px 5px; border-radius: 3px; }
    </style>
</head>
<body>

    <div class="header-box">
        <h1>🏇 Moonbus Choice (官方格式排位表)</h1>
        <div class="meta-tags" id="day-header">
            <span class="tag">載入賽事中...</span>
        </div>
    </div>

    <!-- 場次按鈕 -->
    <div class="race-nav" id="race-nav"></div>

    <!-- 賽事簡介 -->
    <div class="race-info-bar">
        <div><b id="current-race-title">第 -- 場</b></div>
        <div id="current-race-detail" style="color: #94a3b8;">開跑時間: --:--</div>
    </div>

    <!-- 官方標準排位表 -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>馬號</th>
                    <th style="text-align: left;">馬名 (烙號)</th>
                    <th>騎師</th>
                    <th>檔位</th>
                    <th>負磅</th>
                    <th>練馬師</th>
                    <th>評分</th>
                </tr>
            </thead>
            <tbody id="horse-table-body">
                <!-- 動態注入 -->
            </tbody>
        </table>
    </div>

    <script>
        let globalData = null;
        let currentRaceIndex = 0;

        async function initApp() {
            try {
                const response = await fetch(`data.json?t=${new Date().getTime()}`);
                globalData = await response.json();

                document.getElementById('day-header').innerHTML = `
                    <span class="tag tag-highlight">📅 ${globalData.race_date}</span>
                    <span class="tag">📍 ${globalData.venue}</span>
                    <span class="tag">🌱 地質: ${globalData.track_condition}</span>
                    <span class="tag">🏁 共 ${globalData.total_races} 場</span>
                `;

                renderRaceNav();
                renderRace(0);

            } catch (err) {
                console.error("載入失敗：", err);
            }
        }

        function renderRaceNav() {
            const nav = document.getElementById('race-nav');
            nav.innerHTML = '';

            globalData.races.forEach((race, index) => {
                const btn = document.createElement('button');
                btn.className = `race-btn ${index === currentRaceIndex ? 'active' : ''}`;
                btn.innerText = `第 ${race.race_number} 場`;
                btn.onclick = () => {
                    currentRaceIndex = index;
                    renderRaceNav();
                    renderRace(index);
                };
                nav.appendChild(btn);
            });
        }

        function renderRace(raceIndex) {
            const race = globalData.races[raceIndex];

            document.getElementById('current-race-title').innerText = `第 ${race.race_number} 場 (${race.class})`;
            document.getElementById('current-race-detail').innerText = `⏰ ${race.post_time} 開跑 | ${race.distance} | ${race.course}`;

            const tbody = document.getElementById('horse-table-body');
            tbody.innerHTML = '';

            if (race.horses && race.horses.length > 0) {
                race.horses.forEach(h => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td><b>${h.number}</b></td>
                        <td class="horse-name">${h.name} <small style="color:#64748b;">(${h.brand})</small></td>
                        <td>${h.jockey}</td>
                        <td><span class="draw-badge">${h.draw}</span></td>
                        <td>${h.weight}</td>
                        <td>${h.trainer}</td>
                        <td>${h.rating}</td>
                    `;
                    tbody.appendChild(row);
                });
            } else {
                tbody.innerHTML = `<tr><td colspan="7" style="padding:20px; color:#94a3b8;">本場次暫無排位資料</td></tr>`;
            }
        }

        initApp();
        setInterval(initApp, 15000);
    </script>
</body>
</html>
