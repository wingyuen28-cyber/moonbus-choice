<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>6維終極版 v6</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:PingFang HK,sans-serif}body{background:#0e0e10;color:#eaeaea;padding:12px}.header{background:#1a1a1e;padding:16px;border-radius:14px;margin-bottom:12px;border:1px solid #333}.rec-wrap{display:grid;gap:10px;margin-bottom:14px}@media(min-width:768px){.rec-wrap{grid-template-columns:1fr 1fr 1fr}}.rec{border-radius:12px;padding:12px;border-left:4px solid #333}.rec.green{border-left-color:#2ed573;background:#162a1a}.rec.red{border-left-color:#ff4757;background:#2a161a}.rec.yellow{border-left-color:#ffa502;background:#2a2416}.horse-card{background:#18181c;border-radius:14px;padding:12px;margin-bottom:12px;border:1px solid #2a2a2e}.odds-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1.2fr;gap:6px;margin:8px 0}.t-box{background:#1f1f25;border-radius:10px;padding:8px;text-align:center;border:1px solid #2c2c34}.t-box.hot{border-color:#ff4757;background:#261a1e}.t-box.final{background:linear-gradient(135deg,#ff4757,#ff6b81);color:#fff}.t-label{font-size:9px;color:#aaa}.t-val{font-size:16px;font-weight:900}.t-diff{font-size:10px}.t-diff.down{color:#2ed573}.pool{font-size:9px;padding:3px 6px;background:#222;border-radius:10px;margin:2px;display:inline-block}.pool.drop{background:#2a1a1a;border:1px solid #ff4757;color:#ff8f8f}</style></head><body>
<div class="header"><h1>🏁 6維終極版 - 6維智能賽馬分析</h1><p id="race-info">載入中... T1 20% | T2 30% | T3 50% + T3vsT1終極驗證</p></div>
<div class="rec-wrap"><div class="rec green"><h3>🟢 最合理 4隻 (基本面)</h3><ul id="solid-list"></ul></div><div class="rec red"><h3>🔴 重票 4隻 (跨彩池)</h3><ul id="heavy-list"></ul></div><div class="rec yellow"><h3>⚡️ 爆冷 2隻 (T3突襲)</h3><ul id="outsider-list"></ul></div></div>
<div id="horses"></div>
<script>
async function load(){
 const res=await fetch('data.json?t='+Date.now()); const data=await res.json();
 document.getElementById('race-info').innerText=data.race+" | "+new Date(data.timestamp).toLocaleString('zh-HK');
 document.getElementById('solid-list').innerHTML=data.recommendations.solid.detail.map(d=>`<li>${d}</li>`).join('');
 document.getElementById('heavy-list').innerHTML=data.recommendations.heavy.detail.map(d=>`<li>${d}</li>`).join('');
 document.getElementById('outsider-list').innerHTML=data.recommendations.outsiders.detail.map(d=>`<li>${d}</li>`).join('')||'<li>暫無</li>';
 document.getElementById('horses').innerHTML=data.horses.map(h=>`
  <div class="horse-card">
   <div style="display:flex;justify-content:space-between"><b>${h.no}號 ${h.name} ${h.draw}檔 ${h.style} ${h.jockey}/${h.trainer}</b><span style="background:${h.grade=='S'?'#ffd700':'#2ed573'};color:#000;padding:2px 8px;border-radius:10px;font-size:11px">${h.grade} ${h.total}分</span></div>
   <div style="font-size:11px;color:#888;margin:6px 0">D1 ${h.d1} ${h.d1_desc} | D2 ${h.d2} ${h.d2_desc} | D3 ${h.d3} ${h.d3_desc} | D4 ${h.d4} ${h.d4_desc}</div>
   <div class="odds-grid">
    <div class="t-box"><span class="t-label">T1 隔夜 20%</span><span class="t-val">${h.d5_display.t1.value}倍</span><span class="t-diff">基準</span></div>
    <div class="t-box"><span class="t-label">T2 中段 30%</span><span class="t-val">${h.d5_display.t2.value}倍</span><span class="t-diff down">↓ ${h.d5_display.t2.diff.toFixed(1)}%</span></div>
    <div class="t-box hot"><span class="t-label">T3 臨場 50%</span><span class="t-val">${h.d5_display.t3.value}倍</span><span class="t-diff down">↓ ${h.d5_display.t3.diff.toFixed(1)}%</span></div>
    <div class="t-box final"><span class="t-label">T3 vs T1 終極</span><span class="t-val">-${h.d5_display.t3_vs_t1.diff.toFixed(1)}%</span><span class="t-diff">${h.d5_display.t3_vs_t1.is_smart?'🔥Smart Money':'正常'}</span></div>
   </div>
   <div>${Object.entries(h.d5_display.all_drops).map(([k,v])=>`<span class="pool ${v.t1_t3>20?'drop':''}">${k.toUpperCase()} ${v.t1}→${v.t3} -${v.t1_t3.toFixed(0)}%</span>`).join('')}</div>
   <div style="font-size:11px;margin-top:6px;color:#aaa">${h.d5_desc} ${h.d5_tags.join(' ')} ${h.injury_alert}</div>
  </div>`).join('');
}load();
</script></body></html>
